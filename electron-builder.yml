appId: app.notdown.desktop
productName: Notdown
directories:
  output: .run/desktop-release
files:
  - desktop-dist/**/*
  - package.json
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop-dist/icon.png
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
artifactName: Notdown-Setup-${version}-${arch}.${ext}
