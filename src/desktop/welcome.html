<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"><title>Welcome to Notdown</title><link rel="stylesheet" href="welcome.css"></head>
<body><main><img class="logo" src="icon.png" alt=""><p class="eyebrow">NOTDOWN · LOCAL MARKDOWN</p><h1>A home for your notes.</h1><p class="intro">Choose where your notes live. Write in blocks, keep your files.</p>
<div class="actions"><button id="create">Create a new vault<span>Choose an empty folder on your computer</span></button><button id="open">Open an existing vault<span>Select a Notdown folder containing pages</span></button></div>
<p class="hint">Already have Markdown notes? Create a vault, then choose <strong>Import Markdown folder</strong>. Your original folder stays unchanged.</p>
<section aria-label="Recent vaults"><h2>Recent vaults</h2><div id="recents"></div></section><p id="status" role="status"></p><footer>Stored on your computer. No account required.</footer></main><script src="welcome.js"></script></body></html>
