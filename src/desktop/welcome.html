<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"><title>Notdown</title><link rel="stylesheet" href="welcome.css"></head>
<body><header class="welcome-titlebar"><img src="icon.png" width="18" height="18" alt="">Notdown</header><main><img class="logo" src="icon.png" alt=""><h1>Notdown</h1><p class="intro">Open or create a vault.</p>
<div class="actions"><button id="create">Create a new vault<span>Choose an empty folder on your computer</span></button><button id="open">Open an existing vault<span>Select a Notdown folder containing pages</span></button></div>
<section aria-label="Notdown data folder"><h2>Your Notdown vaults</h2><p id="data-path" class="hint"></p><form id="managed-form"><label for="vault-name">New vault name</label><div class="managed-create"><input id="vault-name" name="vault-name" placeholder="My notes" maxlength="80" required><button id="managed-create" type="submit">Create vault here</button></div></form><div id="managed-vaults"></div></section>
<p class="hint">Already have Markdown notes? Create a vault, then choose <strong>Import Markdown folder</strong>. Your original folder stays unchanged.</p>
<section aria-label="Recent vaults"><h2>Recent vaults</h2><div id="recents"></div></section><p id="status" role="status"></p></main><script src="welcome.js"></script></body></html>
